# Perfil opcional: .\mvnw spring-boot:run "-Dspring-boot.run.profiles=mysql"
# Requiere una base de datos MySQL 8 llamada quova_ats (se crea sola si el usuario tiene permisos)
spring.datasource.url=jdbc:mysql://localhost:3306/quova_ats?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${QUOVA_DB_USER:root}
spring.datasource.password=${QUOVA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
