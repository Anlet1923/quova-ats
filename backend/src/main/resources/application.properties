spring.application.name=quova-ats
server.port=8080

# Base de datos H2 en archivo: no requiere instalar nada (se crea en backend/data)
spring.datasource.url=jdbc:h2:file:./data/quova;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CV: el limite funcional es 10 MB; el margen permite responder con un mensaje claro
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
server.tomcat.max-swallow-size=-1

springdoc.swagger-ui.path=/swagger-ui.html

# Seguridad (cambiar el secreto con la variable QUOVA_JWT_SECRET fuera de desarrollo)
quova.jwt.secret=${QUOVA_JWT_SECRET:quova-ats-secreto-de-desarrollo-cambiar-en-produccion-2026}
quova.jwt.expiracion-minutos=480
quova.login.max-intentos=5
quova.login.minutos-bloqueo=15
quova.cv.directorio=./data/cv
